<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字實驗室 · Word Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff8ef;
  --paper2:#fef1e3;
  --ink:#42342a;
  --ink-soft:#7a6a5c;
  --grape:#8b6dd6;
  --grape-deep:#6f51c4;
  --bubble:#ff8fb1;
  --bubble-deep:#f56a96;
  --mint:#4ecdb0;
  --mint-deep:#2fae93;
  --sun:#ffc94d;
  --sun-deep:#f0ab1f;
  --sky:#5fc4ee;
  --coral:#ff7a59;
  --card-shadow:0 10px 0 rgba(110,81,196,.18), 0 18px 34px rgba(110,81,196,.20);
  --pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:"Fredoka","Noto Sans TC",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 18% 12%, #ffe9d2 0, transparent 42%),
    radial-gradient(circle at 84% 8%, #e7ddff 0, transparent 40%),
    radial-gradient(circle at 90% 88%, #d2f6ec 0, transparent 38%),
    radial-gradient(circle at 8% 92%, #ffe0ec 0, transparent 38%),
    var(--paper);
  min-height:100vh;
  overflow-x:hidden;
}
/* ===== floating background doodles ===== */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.doodle{position:absolute;opacity:.5;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-26px) rotate(12deg)}
  100%{transform:translateY(0) rotate(0)}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== layout ===== */
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:18px 16px 120px}

/* ===== header ===== */
header.top{text-align:center;padding:14px 0 8px;position:relative}
.mascot-wrap{position:relative;display:inline-block}
#mascot{width:118px;height:118px;display:block;margin:0 auto;cursor:pointer;
  filter:drop-shadow(0 8px 10px rgba(110,81,196,.25));
  animation:bob 2.6s ease-in-out infinite;transform-origin:bottom center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#mascot.cheer{animation:cheer .6s var(--pop)}
@keyframes cheer{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-7deg)}60%{transform:scale(1.1) rotate(7deg)}100%{transform:scale(1) rotate(0)}}
.title{font-family:"Baloo 2","Noto Sans TC",cursive;font-weight:800;font-size:clamp(30px,7vw,46px);
  margin:6px 0 2px;letter-spacing:.5px;line-height:1;
  background:linear-gradient(95deg,var(--grape),var(--bubble) 45%,var(--coral));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.subtitle{font-weight:600;color:var(--ink-soft);font-size:15px;margin:0 0 4px}
.speech{display:inline-block;background:#fff;border:2.5px solid var(--ink);border-radius:16px;
  padding:7px 14px;font-weight:600;font-size:14px;margin-top:6px;position:relative;
  box-shadow:0 4px 0 rgba(66,52,42,.15);color:var(--ink);min-height:20px}
.speech::after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:14px;height:14px;background:#fff;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink)}

/* ===== progress jar ===== */
.statbar{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px auto 6px;flex-wrap:wrap}
.jar{width:54px;height:66px;border:3px solid var(--ink);border-radius:8px 8px 14px 14px;position:relative;
  background:rgba(255,255,255,.6);overflow:hidden;flex:0 0 auto;box-shadow:0 4px 0 rgba(66,52,42,.12)}
.jar::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:30px;height:9px;
  background:var(--ink);border-radius:4px 4px 0 0}
.jar-fill{position:absolute;left:0;right:0;bottom:0;height:0%;
  background:linear-gradient(180deg,var(--mint),var(--mint-deep));transition:height .6s var(--pop)}
.jar-fill::after{content:"";position:absolute;top:-6px;left:0;right:0;height:8px;border-radius:50%;
  background:rgba(255,255,255,.4)}
.stattext{font-family:"Baloo 2";font-weight:700;font-size:15px;color:var(--ink)}
.stattext b{color:var(--mint-deep);font-size:20px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:2.5px solid var(--ink);
  border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(66,52,42,.14)}
.chip svg{width:16px;height:16px}

/* ===== controls ===== */
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.pill{font-family:"Baloo 2";font-weight:700;border:2.5px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;box-shadow:0 4px 0 rgba(66,52,42,.16);
  transition:transform .12s var(--pop),box-shadow .12s,background .15s}
.pill:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(66,52,42,.16)}
.pill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(66,52,42,.16)}
.pill.on{background:var(--grape);color:#fff;border-color:var(--grape-deep)}
.pill.shuffle{background:var(--sun);border-color:var(--sun-deep)}
.pill.reset{background:var(--bubble);border-color:var(--bubble-deep);color:#fff}
.pill.weak{background:#fff;border-color:var(--grape-deep);color:var(--grape-deep);position:relative}
.pill.weak.on{background:var(--grape);color:#fff}
.weakBadge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;
  padding:0 4px;margin-left:6px;border-radius:999px;background:var(--coral);color:#fff;font-size:11px;
  font-weight:800;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--coral)}

/* ===== weak panel (錯題榜) ===== */
.weakPanel{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s var(--pop),opacity .3s,margin .3s;
  margin-top:0;border-radius:22px}
.weakPanel.show{max-height:640px;opacity:1;margin-top:16px;overflow:auto;
  border:3px solid var(--grape);background:linear-gradient(170deg,#fff,#f6f1ff);
  box-shadow:0 8px 0 rgba(110,81,196,.16);padding:16px 16px 18px}
.weak-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.weak-title{font-family:"Baloo 2","Noto Sans TC";font-weight:800;font-size:16px;color:var(--grape-deep);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weak-pill{font-size:12px;background:#fff;border:2px solid var(--grape);border-radius:999px;padding:2px 9px;color:var(--grape-deep)}
.weak-x{border:2.5px solid var(--ink);background:#fff;border-radius:11px;width:32px;height:32px;cursor:pointer;
  font-weight:800;color:var(--ink-soft);box-shadow:0 3px 0 rgba(66,52,42,.14);transition:transform .12s var(--pop)}
.weak-x:hover{transform:translateY(-2px)}
.weak-x:active{transform:translateY(2px)}
.weak-sub{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:10px}
.weak-sub b{color:var(--coral)}
.weak-empty{text-align:center;font-family:"Baloo 2","Noto Sans TC";font-weight:700;color:var(--mint-deep);
  font-size:16px;line-height:1.7;padding:22px 8px}
.weak-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;cursor:pointer;
  border:2.5px solid var(--ink);border-radius:15px;padding:9px 11px;margin-bottom:9px;
  box-shadow:0 4px 0 rgba(66,52,42,.12);transition:transform .12s var(--pop),box-shadow .12s}
.weak-item:hover{transform:translateY(-2px) rotate(-.4deg);box-shadow:0 6px 0 rgba(66,52,42,.12)}
.weak-item:active{transform:translateY(2px)}
.weak-item.danger{border-color:var(--coral);box-shadow:0 4px 0 var(--coral);background:linear-gradient(180deg,#fff,#fff2ee)}
.weak-rank{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--grape);color:#fff;
  font-family:"Baloo 2";font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.weak-item.danger .weak-rank{background:var(--coral)}
.weak-item:nth-child(2) .weak-rank{background:var(--sun-deep)}
.weak-main{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.weak-word{font-family:"Nunito";font-weight:800;font-size:16px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.weak-zh{font-size:12px;color:var(--ink-soft);font-weight:600}
.weak-bar{height:9px;background:#eee6f7;border-radius:999px;overflow:hidden}
.weak-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--grape),var(--bubble))}
.weak-item.danger .weak-fill{background:linear-gradient(90deg,var(--coral),var(--bubble-deep))}
.weak-num{flex:0 0 auto;font-family:"Baloo 2";font-weight:800;font-size:20px;color:var(--coral)}
.weak-num small{font-size:11px;color:var(--ink-soft);font-weight:700;margin-left:1px}

/* ===== alert modal (錯滿 5 次) ===== */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(66,52,42,.42);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.alertcard{position:relative;width:100%;max-width:420px;background:#fff;border:3.5px solid var(--ink);
  border-radius:26px;padding:24px 22px 20px;box-shadow:0 14px 0 rgba(66,52,42,.2);text-align:center;
  transform:scale(.8) translateY(20px);transition:transform .35s var(--pop)}
.overlay.show .alertcard{transform:scale(1) translateY(0)}
.alert-close{position:absolute;top:12px;right:12px;border:2.5px solid var(--ink);background:#fff;border-radius:11px;
  width:32px;height:32px;cursor:pointer;font-weight:800;color:var(--ink-soft);box-shadow:0 3px 0 rgba(66,52,42,.14)}
.alert-close:active{transform:translateY(2px)}
.alert-emoji{font-size:52px;line-height:1;animation:wobble 1s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.alert-h{font-family:"Baloo 2","Noto Sans TC";font-weight:800;font-size:20px;color:var(--coral);margin:8px 0 4px}
.alert-word{font-family:"Nunito";font-weight:800;font-size:30px;color:var(--grape-deep);line-height:1.1}
.alert-word small{display:block;font-size:14px;color:var(--ink-soft);font-weight:600;margin-top:2px}
.alert-count{font-weight:700;font-size:14px;color:var(--ink);margin:8px 0 12px}
.alert-count b{color:var(--coral);font-size:18px}
.alert-info{background:var(--paper2);border:2.5px dashed #e0c8a8;border-radius:16px;padding:12px 14px;text-align:left;margin-bottom:16px}
.alert-row{font-size:13.5px;line-height:1.55;color:var(--ink);font-weight:500;margin:3px 0}
.alert-lab{font-family:"Baloo 2";font-weight:800;color:var(--grape-deep);margin-right:6px;white-space:nowrap}
.alert-acts{display:flex;gap:10px}
.alert-btn{flex:1;font-family:"Baloo 2","Noto Sans TC";font-weight:800;cursor:pointer;border-radius:14px;
  padding:12px;font-size:15px;border:3px solid var(--ink);transition:transform .12s var(--pop),box-shadow .12s}
.alert-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(66,52,42,.16)}
.alert-btn.go{background:var(--grape);color:#fff;border-color:var(--grape-deep);box-shadow:0 4px 0 var(--grape-deep)}
.alert-btn:hover{transform:translateY(-2px)}
.alert-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(66,52,42,.16)}

/* ===== card deck ===== */
.deck{margin-top:18px;perspective:1600px}
.cardpos{position:relative}
.counter{text-align:center;font-family:"Baloo 2";font-weight:700;color:var(--ink-soft);font-size:14px;margin-bottom:8px}
.counter span{color:var(--grape-deep)}

.flip{position:relative;width:100%;transform-style:preserve-3d;transition:transform .7s var(--pop),height .35s ease;min-height:430px}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:3px solid var(--ink);border-radius:26px;padding:22px 20px 20px;
  background:#fff;box-shadow:var(--card-shadow);display:flex;flex-direction:column}
.face.back{transform:rotateY(180deg);background:linear-gradient(170deg,#fff 60%,var(--paper2))}

/* front face */
.facehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qnum{font-family:"Baloo 2";font-weight:800;font-size:15px;color:#fff;background:var(--grape);
  border:2.5px solid var(--grape-deep);border-radius:12px;padding:3px 11px;box-shadow:0 3px 0 var(--grape-deep)}
.tag{font-weight:700;font-size:12px;color:var(--ink-soft);background:var(--paper2);border-radius:999px;
  padding:4px 11px;border:2px dashed #d8c3a8}
.sentence{font-family:"Nunito",sans-serif;font-weight:600;font-size:18px;line-height:1.7;color:var(--ink);
  margin:4px 0 14px;letter-spacing:.1px}
.blank{display:inline-block;min-width:84px;text-align:center;border-bottom:3px dotted var(--grape);
  color:transparent;font-weight:800;margin:0 3px;position:relative;transition:color .3s}
.blank.filled{color:var(--grape-deep);border-bottom-color:var(--mint-deep)}
.blank.filled::after{content:"";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.opt{font-family:"Fredoka","Noto Sans TC",sans-serif;text-align:left;border:2.5px solid var(--ink);
  background:#fff;border-radius:15px;padding:10px 12px;cursor:pointer;font-size:15px;font-weight:600;
  box-shadow:0 4px 0 rgba(66,52,42,.14);transition:transform .12s var(--pop),box-shadow .12s,background .2s,border-color .2s;
  display:flex;flex-direction:column;gap:1px;position:relative;overflow:hidden}
.opt .lt{font-family:"Baloo 2";font-weight:800;color:var(--grape);font-size:13px}
.opt .en{font-weight:700;color:var(--ink)}
.opt .zh{font-size:12px;color:var(--ink-soft);font-weight:600}
.opt:hover:not(.done){transform:translateY(-2px) rotate(-.5deg);box-shadow:0 6px 0 rgba(66,52,42,.14)}
.opt:active:not(.done){transform:translateY(2px)}
.opt.correct{background:linear-gradient(180deg,#e6fff6,#c6f6e6);border-color:var(--mint-deep);box-shadow:0 4px 0 var(--mint-deep)}
.opt.correct .lt{color:var(--mint-deep)}
.opt.wrong{background:linear-gradient(180deg,#ffeef2,#ffd9e3);border-color:var(--bubble-deep);box-shadow:0 4px 0 var(--bubble-deep);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt.dim{opacity:.45}
.opt .mark{position:absolute;top:6px;right:8px;font-size:18px;opacity:0;transform:scale(0)}
.opt.correct .mark,.opt.wrong .mark{opacity:1;transform:scale(1);transition:transform .3s var(--pop) .1s}

/* collocation reveal */
.colloBox{background:linear-gradient(180deg,#fff7e9,#ffeecb);border:2.5px dashed var(--sun-deep);
  border-radius:16px;padding:12px 14px;margin-top:12px;display:none}
.colloBox.show{display:block;animation:revealPop .45s var(--pop)}
@keyframes revealPop{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.colloBox .lab{font-family:"Baloo 2";font-weight:800;color:var(--sun-deep);font-size:13px;display:flex;align-items:center;gap:5px;margin-bottom:4px}
.colloBox .colloen{font-family:"Nunito";font-weight:800;font-size:17px;color:var(--coral)}
.colloBox .collozh{font-weight:600;color:var(--ink-soft);font-size:13px;margin:2px 0 6px}
.colloBox .tip{font-size:13.5px;line-height:1.55;color:var(--ink);font-weight:500}

/* flip hint button on front */
.flipbtn{margin-top:12px;align-self:center;font-family:"Baloo 2";font-weight:800;border:none;cursor:pointer;
  background:linear-gradient(95deg,var(--grape),var(--bubble));color:#fff;border-radius:999px;padding:11px 22px;
  font-size:15px;box-shadow:0 5px 0 var(--grape-deep);transition:transform .12s var(--pop),box-shadow .12s;
  display:flex;align-items:center;gap:8px}
.flipbtn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--grape-deep)}
.flipbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--grape-deep)}
.flipbtn svg{width:18px;height:18px;animation:spin 4s linear infinite}

/* ===== listen / speak buttons ===== */
.sentrow{display:flex;align-items:flex-start;gap:10px;margin:4px 0 14px}
.sentrow .sentence{margin:0;flex:1}
.speakbtn{flex:0 0 auto;width:42px;height:42px;border:2.5px solid var(--sky);background:#eaf7fe;color:#2f9fd6;
  border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #b9e3f6;transition:transform .12s var(--pop),box-shadow .12s,background .2s;margin-top:2px}
.speakbtn svg{width:22px;height:22px}
.speakbtn:hover{transform:translateY(-2px);background:#d8f0fc}
.speakbtn:active{transform:translateY(2px);box-shadow:0 2px 0 #b9e3f6}
.speakbtn .wave{opacity:.9;transform-origin:11px 12px}
.speakbtn.speaking{background:linear-gradient(180deg,#d6f6ee,#bff0e2);border-color:var(--mint-deep);color:var(--mint-deep);box-shadow:0 4px 0 var(--mint-deep);animation:speakpulse .7s ease-in-out infinite}
@keyframes speakpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.speakbtn.speaking .w1{animation:wavemove .6s ease-in-out infinite}
.speakbtn.speaking .w2{animation:wavemove .6s ease-in-out .15s infinite}
@keyframes wavemove{0%,100%{opacity:.3}50%{opacity:1}}
.speakbtn.small{width:34px;height:34px;border-radius:11px}
.speakbtn.small svg{width:18px;height:18px}
.bwordrow{display:inline-flex;align-items:center;gap:9px}

/* back face : etymology */
.backhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.bword{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--grape-deep);line-height:1}
.bword small{font-size:14px;color:var(--ink-soft);font-weight:600;display:block;margin-top:2px}
.dna{font-family:"Baloo 2";font-weight:800;color:var(--coral);font-size:13px;background:#fff3ee;
  border:2px solid var(--coral);border-radius:999px;padding:4px 11px}
.morphs{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0 14px}
.morph{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 11px;min-width:78px;
  position:relative;box-shadow:0 4px 0 rgba(66,52,42,.13);opacity:0;transform:translateY(14px) scale(.85)}
.flip.flipped .face.back .morph{animation:popin .5s var(--pop) forwards}
@keyframes popin{to{opacity:1;transform:translateY(0) scale(1)}}
.morph .mpart{font-family:"Baloo 2";font-weight:800;font-size:18px}
.morph .mmean{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:1px;line-height:1.35}
.morph:nth-child(odd) .mpart{color:var(--grape-deep)}
.morph:nth-child(even) .mpart{color:var(--bubble-deep)}
.plus{align-self:center;font-family:"Baloo 2";font-weight:800;font-size:20px;color:var(--ink-soft);opacity:0}
.flip.flipped .face.back .plus{animation:popin .4s var(--pop) forwards}
.storybox{background:linear-gradient(170deg,#f3eeff,#e9e0ff);border:2.5px solid var(--grape);border-radius:16px;
  padding:13px 15px;margin-top:auto}
.storybox .lab{font-family:"Baloo 2";font-weight:800;color:var(--grape-deep);font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.storybox .txt{font-size:15px;line-height:1.6;font-weight:600;color:var(--ink)}
.storybox .arrow{color:var(--coral);font-weight:800;display:inline;white-space:nowrap;padding:0 4px}

.backfoot{display:flex;justify-content:center;margin-top:12px}
.flipback{font-family:"Baloo 2";font-weight:800;border:2.5px solid var(--ink);background:#fff;color:var(--ink);
  cursor:pointer;border-radius:999px;padding:9px 20px;font-size:14px;box-shadow:0 4px 0 rgba(66,52,42,.16);
  display:flex;align-items:center;gap:7px;transition:transform .12s var(--pop)}
.flipback:hover{transform:translateY(-2px)}
.flipback:active{transform:translateY(2px)}
.flipback svg{width:16px;height:16px}

/* nav arrows */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.arrow{font-family:"Baloo 2";font-weight:800;border:3px solid var(--ink);background:#fff;color:var(--ink);
  cursor:pointer;border-radius:18px;padding:12px 18px;font-size:16px;box-shadow:0 5px 0 rgba(66,52,42,.16);
  display:flex;align-items:center;gap:6px;transition:transform .12s var(--pop),box-shadow .12s;flex:1;justify-content:center}
.arrow:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(66,52,42,.16)}
.arrow:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(66,52,42,.16)}
.arrow.next{background:var(--mint);border-color:var(--mint-deep);color:#fff;box-shadow:0 5px 0 var(--mint-deep)}
.arrow:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 5px 0 rgba(66,52,42,.16)}
.arrow svg{width:18px;height:18px}

/* jump grid */
.jumpwrap{margin-top:22px}
.jumptitle{font-family:"Baloo 2";font-weight:800;color:var(--ink-soft);font-size:14px;text-align:center;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{aspect-ratio:1;border:2px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;
  font-family:"Baloo 2";font-weight:800;font-size:13px;color:var(--ink-soft);transition:transform .12s var(--pop),background .2s;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(66,52,42,.12)}
.cell:hover{transform:translateY(-2px)}
.cell.cur{background:var(--grape);color:#fff;border-color:var(--grape-deep)}
.cell.done{background:var(--mint);color:#fff;border-color:var(--mint-deep)}
.cell.cur.done{background:var(--grape);border-color:var(--grape-deep)}

/* confetti + sticker pop */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf{position:absolute;width:11px;height:11px;will-change:transform,opacity}
.bigstar{position:fixed;left:50%;top:42%;font-size:64px;transform:translate(-50%,-50%) scale(0);z-index:60;pointer-events:none}
.bigstar.go{animation:starpop .8s var(--pop)}
@keyframes starpop{0%{transform:translate(-50%,-50%) scale(0) rotate(-30deg);opacity:1}
  60%{transform:translate(-50%,-50%) scale(1.25) rotate(10deg);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:0}}

footer{text-align:center;color:var(--ink-soft);font-size:12px;font-weight:600;margin-top:30px;opacity:.8}

@media (max-width:520px){
  .opts{grid-template-columns:1fr 1fr}
  .sentence{font-size:16.5px}
  .grid{grid-template-columns:repeat(5,1fr)}
  .flip{min-height:470px}
  .bword{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;transition-duration:.05s!important}
  .doodle{display:none}
}
</style>
</head>

    options:[["A","respectful","尊重的"],["B","miserable","痛苦的"],["C","rebellious","叛逆的"],["D","offensive","冒犯的"]],
    roots:[["re-","反覆、再次"],["spect","看（源自 specere）"],["ful","充滿的"]],
    rootStory:"行為端正、令人禁不住想反覆投以敬重目光的 → 「尊重的、恭敬的」"
  },
  {
    n:50, word:"pioneer", ans:"B",
    sentence:["Marie Curie was a ","pioneer"," in the field of radioactivity, and her groundbreaking research paved the way for modern physics."],
    collo:"a pioneer in the field of... / pave the way for...",
    colloZh:"某領域的先驅／為……鋪路",
    tip:"居禮夫人是放射線領域的「先驅」，她的研究為現代物理學「奠定基礎」。",
    options:[["A","cyborg","生化人"],["B","pioneer","先驅"],["C","assistant","助手"],["D","villager","村民"]],
    roots:[["peon","步兵、用雙腳在最前方探路開疆的開路先鋒（古法文）"],["pes/pedis","腳（拉丁文）"]],
    rootStory:"用雙腳在最前方探路與開闢疆土 → 「先驅、拓荒者」"
  }
];

</script>
<script>
/* ===== state ===== */
let order = QUESTIONS.map((_,i)=>i);
let pos = 0;                 // position in order
let mode = 'quiz';          // 'quiz' | 'study'
const solved = new Set();   // indices (original) answered correctly
let streak = 0;

/* ===== persistence (localStorage) ===== */
/* 在 GitHub Pages 等正式網站可正常運作；Claude 內建預覽會擋 storage，
   故以下全部包 try/catch，擋掉時自動退回「只在本次有效」模式。 */
const LS_WRONG  = 'wordlab.wrong.v1';   // { word: 次數 }
const LS_SOLVED = 'wordlab.solved.v1';  // [ word, word, ... ]
const WRONG_ALERT = 5;                  // 錯幾次跳提醒
let storageOK = true;
let wrongCounts = {};                   // word -> 累積答錯次數
const alerted = new Set();              // 本次已提醒過、避免洗版

function loadProgress(){
  try{
    const w = JSON.parse(localStorage.getItem(LS_WRONG) || '{}');
    if(w && typeof w==='object') wrongCounts = w;
    const s = JSON.parse(localStorage.getItem(LS_SOLVED) || '[]');
    if(Array.isArray(s)){
      const byWord = {}; QUESTIONS.forEach((q,i)=>byWord[q.word]=i);
      s.forEach(word=>{ if(word in byWord) solved.add(byWord[word]); });
    }
  }catch(e){ storageOK=false; }
}
function saveProgress(){
  if(!storageOK) return;
  try{
    localStorage.setItem(LS_WRONG, JSON.stringify(wrongCounts));
    const words = [...solved].map(i=>QUESTIONS[i].word);
    localStorage.setItem(LS_SOLVED, JSON.stringify(words));
  }catch(e){ storageOK=false; }
}
function clearProgress(){
  wrongCounts = {}; alerted.clear();
  try{ localStorage.removeItem(LS_WRONG); localStorage.removeItem(LS_SOLVED); }catch(e){}
}
// 偵測 storage 是否可用
try{ const k='wordlab.test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); }
catch(e){ storageOK=false; }

const $ = id => document.getElementById(id);
const flip = $('flip');
const cheers = ['太棒啦！','你超強的！','答對囉 🎉','根本天才！','繼續保持！','好厲害～','完美命中！','穩穩的！'];
const nudges = ['再想想看～','差一點點！','看看搭配詞提示？','沒關係，試別的！','深呼吸，再來一次～'];


/* ===== background doodles ===== */
(function(){
  const sky=$('sky');
  const items=['✏️','📚','⭐','🔤','💡','🌈','🎀','🍬','📝','🫧','🔡','✨'];
  for(let i=0;i<16;i++){
    const d=document.createElement('div');
    d.className='doodle';
    d.textContent=items[i%items.length];
    d.style.left=Math.random()*96+'%';
    d.style.top=Math.random()*96+'%';
    d.style.fontSize=(18+Math.random()*26)+'px';
    d.style.animationDuration=(5+Math.random()*6)+'s';
    d.style.animationDelay=(-Math.random()*6)+'s';
    sky.appendChild(d);
  }
})();

/* ===== render front (quiz / study) ===== */
function renderFront(){
  const q = QUESTIONS[order[pos]];
  const answered = solved.has(order[pos]);
  const showAnswer = (mode==='study') || answered;

  // build sentence with blank
  let html = '<div class="facehead">';
  html += `<span class="qnum">Q${q.n}</span>`;
  html += `<span class="tag">${mode==='study'?'看答案＋拆解':'選出正確的字'}</span></div>`;

  let sent = '';
  q.sentence.forEach(seg=>{
    if(seg===q.word){
      sent += `<span class="blank ${showAnswer?'filled':''}" id="blank">${showAnswer?q.word:'?????'}</span>`;
    } else {
      sent += seg;
    }
  });
  html += `<div class="sentrow">
      <button class="speakbtn" id="speakFront" title="聽整句英文" aria-label="聽整句英文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="wave w1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave w2" d="M18.5 6a9 9 0 0 1 0 12"/></svg>
      </button>
      <div class="sentence">${sent}</div>
    </div>`;

  // options
  html += '<div class="opts" id="opts">';
  q.options.forEach(o=>{
    const [lt,en,zh]=o;
    let cls='opt';
    if(showAnswer){
      cls += ' done';
      if(lt===q.ans){cls+=' correct';} else {cls+=' dim';}
    }
    html += `<button class="${cls}" data-lt="${lt}">
        <span class="mark">${lt===q.ans?'✅':''}</span>
        <span class="lt">${lt}</span>
        <span class="en">${en}</span>
        <span class="zh">${zh}</span>
      </button>`;
  });
  html += '</div>';

  // collocation box
  html += `<div class="colloBox ${showAnswer?'show':''}" id="colloBox">
      <div class="lab">🎯 核心搭配詞</div>
      <div class="colloen">${q.collo}</div>
      <div class="collozh">${q.colloZh}</div>
      <div class="tip">💡 ${q.tip}</div>
    </div>`;

  // flip button
  html += `<button class="flipbtn" id="toBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      翻到背面看字根拆解
    </button>`;

  $('front').innerHTML = html;

  // wire listen button (整句英文)
  const sf = $('speakFront');
  function speakCurrentSentence(){
    const reveal = (mode==='study') || solved.has(order[pos]);
    let text;
    if(reveal){
      text = fullSentence(q);
    } else {
      // replace the answer word with a spoken "blank" so we don't spoil it
      text = q.sentence.map(seg=> seg===q.word ? ' blank ' : seg).join('');
      text = text.replace(/\s+([,.;!?])/g,'$1').replace(/\s{2,}/g,' ').trim();
    }
    speak(text, 0.92, sf);
  }
  sf.addEventListener('click',speakCurrentSentence);
  sf._speakFull = ()=>speak(fullSentence(q),0.92,sf); // used after a correct answer

  // wire options
  if(!showAnswer){
    $('opts').querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>handleAnswer(btn,q));
    });
  }
  $('toBack').addEventListener('click',()=>{flip.classList.add('flipped');sizeFlip();});
}

/* ===== render back (etymology) ===== */
function renderBack(){
  const q = QUESTIONS[order[pos]];
  let html = '<div class="backhead">';
  html += `<div class="bword">
      <span class="bwordrow">${q.word}
        <button class="speakbtn small" id="speakWord" title="念這個單字" aria-label="念這個單字">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path class="wave w1" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="wave w2" d="M18.5 6a9 9 0 0 1 0 12"/></svg>
        </button>
      </span>
      <small>第 ${q.n} 題 · 字根字首拆解</small></div>`;
  html += `<span class="dna">🧬 DNA</span></div>`;

  html += '<div class="morphs">';
  q.roots.forEach((r,i)=>{
    if(i>0) html += `<span class="plus" style="animation-delay:${i*0.12-0.04}s">+</span>`;
    html += `<div class="morph" style="animation-delay:${i*0.12}s">
        <div class="mpart">${r[0]}</div>
        <div class="mmean">${r[1]}</div>
      </div>`;
  });
  html += '</div>';

  html += `<div class="storybox">
      <div class="lab">✨ 串起來記</div>
      <div class="txt">${q.rootStory.replace(/→/g,'<span class="arrow">→</span>')}</div>
    </div>`;

  html += `<div class="backfoot">
      <button class="flipback" id="toFront">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 0 1 0 8h-1"/></svg>
        翻回正面
      </button>
    </div>`;

  $('back').innerHTML = html;
  $('toFront').addEventListener('click',()=>{flip.classList.remove('flipped');sizeFlip();});
  const sw=$('speakWord');
  if(sw) sw.addEventListener('click',()=>speak(q.word,0.85,sw));
}

/* ===== size flip container to visible face ===== */
function sizeFlip(){
  const showingBack = flip.classList.contains('flipped');
  const face = showingBack ? $('back') : $('front');
  // temporarily allow natural measurement
  const h = face.scrollHeight;
  flip.style.height = h + 'px';
}
const _ro = new ResizeObserver(()=>sizeFlip());

/* ===== speech synthesis (念整句英文) ===== */
const synth = window.speechSynthesis;
let enVoice = null;
function pickVoice(){
  if(!synth) return;
  const vs = synth.getVoices();
  // prefer a natural English voice
  const prefs = [
    v=>/en-US/i.test(v.lang) && /(Samantha|Google US English|Microsoft Aria|Microsoft Jenny|Natural)/i.test(v.name),
    v=>/en-GB/i.test(v.lang) && /(Google UK English Female|Microsoft|Natural)/i.test(v.name),
    v=>/^en-US/i.test(v.lang),
    v=>/^en-GB/i.test(v.lang),
    v=>/^en/i.test(v.lang)
  ];
  for(const test of prefs){ const m=vs.find(test); if(m){enVoice=m;return;} }
}
if(synth){
  pickVoice();
  synth.onvoiceschanged = pickVoice;
}
let speakBtnActive = null;
function fullSentence(q){
  // join segments into a clean sentence (word is already one of the segments)
  let s = q.sentence.join('');
  // tidy spaces before punctuation
  return s.replace(/\s+([,.;!?])/g,'$1').replace(/\s{2,}/g,' ').trim();
}
function speak(text, rate, btn){
  if(!synth){ sayMascot('這個瀏覽器不支援發音 😢 換 Chrome 或 Safari 試試～'); return; }
  synth.cancel();
  if(speakBtnActive){ speakBtnActive.classList.remove('speaking'); }
  const u = new SpeechSynthesisUtterance(text);
  if(enVoice) u.voice = enVoice;
  u.lang = enVoice ? enVoice.lang : 'en-US';
  u.rate = rate || 0.92;
  u.pitch = 1.05;
  if(btn){
    btn.classList.add('speaking'); speakBtnActive = btn;
    u.onend = u.onerror = ()=>{ btn.classList.remove('speaking'); if(speakBtnActive===btn) speakBtnActive=null; };
  }
  synth.speak(u);
}

/* ===== answer handling ===== */
function handleAnswer(btn,q){
  const chosen = btn.dataset.lt;
  const opts = $('opts');
  if(opts.dataset.locked) return;

  if(chosen===q.ans){
    opts.dataset.locked='1';
    btn.classList.add('correct');
    btn.querySelector('.mark').textContent='✅';
    opts.querySelectorAll('.opt').forEach(b=>{if(b!==btn){b.classList.add('done','dim')}});
    $('blank').textContent=q.word;
    $('blank').classList.add('filled');
    $('colloBox').classList.add('show');
    sizeFlip();
    // 答對後自動念出完整句子
    const sf=$('speakFront'); if(sf && sf._speakFull){ setTimeout(sf._speakFull,260); }
    const wasNew = !solved.has(order[pos]);
    solved.add(order[pos]);
    streak++;
    saveProgress();
    burstConfetti();
    cheerMascot(cheers[Math.floor(Math.random()*cheers.length)]);
    if(wasNew && solved.size%10===0){ popBigStar(); }
    updateStats();
  } else {
    btn.classList.add('wrong');
    btn.querySelector('.mark').textContent='❌';
    streak=0;
    // 累積答錯次數（以單字為 key，洗牌後仍正確）
    wrongCounts[q.word] = (wrongCounts[q.word]||0) + 1;
    saveProgress();
    const n = wrongCounts[q.word];
    updateStats();
    if(n>=WRONG_ALERT && !alerted.has(q.word)){
      alerted.add(q.word);
      showWrongAlert(q, n);          // 錯滿 5 次：跳提醒
    } else {
      sayMascot(nudges[Math.floor(Math.random()*nudges.length)] + (n>=2?` （這個字錯 ${n} 次了）`:''));
    }
    setTimeout(()=>{btn.classList.remove('wrong');btn.querySelector('.mark').textContent='';},700);
  }
}

/* ===== stats / jar ===== */
function updateStats(){
  $('doneCount').textContent = solved.size;
  $('jarfill').style.height = (solved.size/50*100)+'%';
  $('curIdx').textContent = pos+1;
  // streak chip
  const chip=$('streakChip');
  if(streak>=2){chip.style.display='inline-flex';$('streakNum').textContent=streak;}
  else chip.style.display='none';
  renderGrid();
  renderWeak();
}

/* ===== mascot speech ===== */
let speechTimer;
function sayMascot(t){
  $('speech').textContent=t;
  clearTimeout(speechTimer);
  speechTimer=setTimeout(()=>{$('speech').textContent='繼續加油！翻牌看字根會記更牢 🦉';},2600);
}
function cheerMascot(t){
  sayMascot(t);
  const m=$('mascot');
  m.classList.remove('cheer');void m.offsetWidth;m.classList.add('cheer');
}
$('mascot').addEventListener('click',()=>{
  const lines=['你今天好認真！','字根拆開就不用死背囉～','搭配詞是解題的鑰匙 🔑','再 5 題就破關！','相信你做得到 💪','拍拍～休息一下也可以'];
  cheerMascot(lines[Math.floor(Math.random()*lines.length)]);
});

/* ===== confetti ===== */
function burstConfetti(){
  const fx=$('fx');
  const colors=['#8b6dd6','#ff8fb1','#4ecdb0','#ffc94d','#ff7a59','#5fc4ee'];
  const shapes=['','50%','0'];
  for(let i=0;i<34;i++){
    const c=document.createElement('div');
    c.className='conf';
    const col=colors[Math.floor(Math.random()*colors.length)];
    c.style.background=col;
    c.style.borderRadius=shapes[Math.floor(Math.random()*shapes.length)];
    const startX=20+Math.random()*60;
    c.style.left=startX+'%';
    c.style.top='38%';
    const dx=(Math.random()-0.5)*340;
    const dy=260+Math.random()*220;
    const rot=Math.random()*720-360;
    fx.appendChild(c);
    c.animate([
      {transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${rot}deg)`,opacity:0}
    ],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>c.remove();
  }
}
function popBigStar(){
  const s=$('bigstar');
  s.classList.remove('go');void s.offsetWidth;s.classList.add('go');
  sayMascot('哇！又破 10 題，太厲害了 🌟');
}

/* ===== 錯滿 5 次提醒 ===== */
function showWrongAlert(q, n){
  cheerMascot('這個字要特別注意喔！');
  const ov = $('overlay');
  $('alertWord').textContent = q.word;
  $('alertZh').textContent = (q.options.find(o=>o[0]===q.ans)||[])[2] || '';
  $('alertNum').textContent = n;
  $('alertCollo').textContent = q.collo;
  $('alertTip').textContent = q.tip;
  ov.classList.add('show');
  ov.dataset.word = q.word;
}
function closeAlert(){ $('overlay').classList.remove('show'); }

/* ===== 我的弱點 / 錯題排行榜 ===== */
let weakOpen = false;
function wrongList(){
  // 回傳 [ [word, count], ... ] 由多到少，只含 count>0
  return Object.entries(wrongCounts)
    .filter(([,c])=>c>0)
    .sort((a,b)=> b[1]-a[1] || a[0].localeCompare(b[0]));
}
function renderWeak(){
  const list = wrongList();
  const total = list.reduce((s,[,c])=>s+c,0);
  $('weakCount').textContent = list.length;
  const badge = $('weakBadge');
  if(list.length){ badge.style.display='inline-flex'; badge.textContent = list.length; }
  else badge.style.display='none';
  if(!weakOpen) return;

  const body = $('weakBody');
  if(!list.length){
    body.innerHTML = `<div class="weak-empty">目前還沒有答錯的字 🎉<br>太厲害了！繼續保持～</div>`;
    return;
  }
  const max = list[0][1];
  const byWord = {}; QUESTIONS.forEach((q,i)=>byWord[q.word]=i);
  let html = `<div class="weak-sub">總共答錯 <b>${total}</b> 次 · 點任一字可直接前往複習</div>`;
  list.forEach(([word,c],rank)=>{
    const q = QUESTIONS[byWord[word]];
    const zh = (q.options.find(o=>o[0]===q.ans)||[])[2] || '';
    const danger = c>=WRONG_ALERT;
    const w = Math.max(12, Math.round(c/max*100));
    html += `<button class="weak-item${danger?' danger':''}" data-word="${word}">
        <span class="weak-rank">${rank+1}</span>
        <span class="weak-main">
          <span class="weak-word">${word}<span class="weak-zh">${zh}</span></span>
          <span class="weak-bar"><span class="weak-fill" style="width:${w}%"></span></span>
        </span>
        <span class="weak-num">${c}<small>次</small></span>
      </button>`;
  });
  body.innerHTML = html;
  body.querySelectorAll('.weak-item').forEach(it=>{
    it.addEventListener('click',()=>{
      const word = it.dataset.word;
      const oi = byWord[word];
      const p = order.indexOf(oi);
      if(p>=0){ pos=p; goto(); toggleWeak(false);
        document.querySelector('.deck').scrollIntoView({behavior:'smooth',block:'start'}); }
    });
  });
}
function toggleWeak(force){
  weakOpen = (typeof force==='boolean') ? force : !weakOpen;
  $('weakPanel').classList.toggle('show', weakOpen);
  $('weakToggle').classList.toggle('on', weakOpen);
  if(weakOpen) renderWeak();
}

/* ===== grid ===== */
function renderGrid(){
  const g=$('grid');
  g.innerHTML='';
  order.forEach((origIdx,i)=>{
    const q=QUESTIONS[origIdx];
    const cell=document.createElement('button');
    cell.className='cell'+(i===pos?' cur':'')+(solved.has(origIdx)?' done':'');
    cell.textContent=q.n;
    cell.addEventListener('click',()=>{pos=i;goto();});
    g.appendChild(cell);
  });
}

/* ===== navigation ===== */
function goto(){
  if(synth) synth.cancel();
  flip.classList.remove('flipped');
  // brief delay so the flip resets before content swaps
  renderFront();
  renderBack();
  updateStats();
  $('prevBtn').disabled = pos===0;
  $('nextBtn').disabled = pos===order.length-1;
  sizeFlip();
  // pop animation on card
  flip.animate([{transform:'scale(.96)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'});
}
$('prevBtn').addEventListener('click',()=>{if(pos>0){pos--;goto();}});
$('nextBtn').addEventListener('click',()=>{if(pos<order.length-1){pos++;goto();}});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'&&pos>0){pos--;goto();}
  if(e.key==='ArrowRight'&&pos<order.length-1){pos++;goto();}
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip.classList.toggle('flipped');sizeFlip();}
});

/* ===== modes ===== */
function setMode(m){
  mode=m;
  $('modeQuiz').classList.toggle('on',m==='quiz');
  $('modeStudy').classList.toggle('on',m==='study');
  renderFront();
  sizeFlip();
}
$('modeQuiz').addEventListener('click',()=>setMode('quiz'));
$('modeStudy').addEventListener('click',()=>{setMode('study');sayMascot('好的！直接看答案＋拆解，慢慢吸收～');});

/* ===== shuffle / reset ===== */
$('shuffleBtn').addEventListener('click',()=>{
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  pos=0;goto();sayMascot('洗好牌囉！換個順序更能檢測實力 🔀');
});
$('resetBtn').addEventListener('click',()=>{
  if(!confirm('確定要清除所有進度嗎？\n（包含答對紀錄與錯題累積，無法復原）')) return;
  solved.clear();streak=0;order=QUESTIONS.map((_,i)=>i);pos=0;
  clearProgress();
  goto();
  sayMascot('全部歸零！我們重新挑戰一次 💪');
});

/* ===== 弱點面板 / 提醒 視窗 互動 ===== */
$('weakToggle').addEventListener('click',()=>toggleWeak());
$('weakClose').addEventListener('click',()=>toggleWeak(false));
$('alertClose').addEventListener('click',closeAlert);
$('alertGo').addEventListener('click',()=>{
  const word = $('overlay').dataset.word;
  const oi = QUESTIONS.findIndex(q=>q.word===word);
  const p = order.indexOf(oi);
  closeAlert();
  if(p>=0){ pos=p; goto(); }
});
$('overlay').addEventListener('click',e=>{ if(e.target===$('overlay')) closeAlert(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeAlert(); if(weakOpen) toggleWeak(false); } });

/* ===== init ===== */
loadProgress();                 // 先讀回 localStorage 裡的進度
window.addEventListener('resize',()=>sizeFlip());
goto();
if(!storageOK){ setTimeout(()=>sayMascot('提醒：這個預覽環境不會保存進度；上傳到 GitHub 後就能長期記住囉 💾'),900); }
setTimeout(sizeFlip,300); // after fonts settle
</script>
